<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">変更1：入力点へマルチスケール局所幾何特徴を付与</title>
  <desc id="desc">各クエリ点の周囲にある形状点を複数半径のball queryで収集し、スケール別MLPの出力を局所特徴uとして初期特徴へ結合する流れ。</desc>
  <defs>
    <style>
      text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif; fill: #102a43; letter-spacing: 0; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 21px; fill: #486581; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #486581; }
      .tiny { font-size: 12px; fill: #627d98; }
      .box { fill: #ffffff; stroke: #2f6fb0; stroke-width: 2; rx: 8; }
      .geo { fill: #fff7ed; stroke: #e87924; stroke-width: 2.4; rx: 8; }
      .green { fill: #ecfdf5; stroke: #159974; stroke-width: 2.2; rx: 8; }
      .arrow { stroke: #e87924; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .arrow-blue { stroke: #2f6fb0; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    </style>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e87924"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb0"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#f8fbfe"/>
  <rect x="0" y="0" width="1600" height="122" fill="#ffffff"/>
  <text x="54" y="56" class="title">変更1｜入力点へマルチスケール局所幾何特徴 u を付与</text>
  <text x="56" y="92" class="subtitle">形状点群 G → クエリ点群 X：予測対象の各メッシュ点から境界形状を複数スケールで読む</text>
  <line x1="54" y1="116" x2="1546" y2="116" stroke="#d9e2ec" stroke-width="2"/>

  <!-- Before / after strip -->
  <rect class="box" x="56" y="144" width="664" height="108"/>
  <text x="80" y="177" class="label">Transolver</text>
  <rect x="215" y="163" width="190" height="48" rx="8" fill="#f3f8fd" stroke="#2f6fb0" stroke-width="1.8"/>
  <text x="245" y="194" class="body">MLP埋め込み</text>
  <path class="arrow-blue" d="M412 187 L438 187"/>
  <rect x="446" y="163" width="238" height="48" rx="8" fill="#f3f8fd" stroke="#2f6fb0" stroke-width="1.8"/>
  <text x="477" y="194" class="body">Physics-Attention 1</text>
  <text x="215" y="235" class="small">f_i → x_i　／　x：学習済み潜在表現</text>

  <rect class="geo" x="760" y="144" width="784" height="108"/>
  <text x="784" y="177" class="label">GeoTransolver</text>
  <rect x="970" y="163" width="242" height="48" rx="8" fill="#fff7ed" stroke="#e87924" stroke-width="1.8"/>
  <text x="991" y="194" class="body">x̃_i = [x_i, u_i]</text>
  <path class="arrow" d="M1219 187 L1284 187"/>
  <rect x="1292" y="163" width="216" height="48" rx="8" fill="#fff7ed" stroke="#e87924" stroke-width="1.8"/>
  <text x="1350" y="194" class="body">GALE 1</text>
  <text x="970" y="235" class="small">MLP埋め込み x_i に u_i を最初のGALE層の前で結合</text>

  <!-- Neighborhood illustration -->
  <text x="56" y="303" class="section">1. 各クエリ点 x_i の近傍形状を取得</text>
  <rect x="56" y="325" width="650" height="414" rx="8" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <path d="M94 654 C175 510, 258 634, 346 463 C438 286, 555 404, 670 352" fill="none" stroke="#e87924" stroke-width="5"/>
  <g fill="#e87924">
    <circle cx="117" cy="620" r="6"/><circle cx="164" cy="563" r="6"/><circle cx="214" cy="568" r="6"/><circle cx="263" cy="591" r="6"/>
    <circle cx="310" cy="530" r="6"/><circle cx="349" cy="457" r="6"/><circle cx="394" cy="402" r="6"/><circle cx="445" cy="386" r="6"/>
    <circle cx="500" cy="405" r="6"/><circle cx="557" cy="404" r="6"/><circle cx="611" cy="375" r="6"/><circle cx="663" cy="355" r="6"/>
  </g>
  <circle cx="338" cy="535" r="12" fill="#2f6fb0" stroke="#ffffff" stroke-width="4"/>
  <circle cx="338" cy="535" r="66" fill="none" stroke="#159974" stroke-width="3" stroke-dasharray="8 7"/>
  <circle cx="338" cy="535" r="120" fill="none" stroke="#f0a43c" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="338" cy="535" r="182" fill="none" stroke="#2f6fb0" stroke-width="3" stroke-dasharray="12 9"/>
  <text x="354" y="526" class="label">x_i</text>
  <text x="418" y="494" class="small" style="fill:#0f7b5e">小半径 r₁</text>
  <text x="438" y="587" class="small" style="fill:#c76518">中半径 r₂</text>
  <text x="442" y="676" class="small" style="fill:#2f6fb0">大半径 r₃</text>
  <rect x="82" y="346" width="224" height="74" rx="8" fill="#fff7ed" stroke="#e87924" stroke-width="1.8"/>
  <text x="100" y="376" class="body">形状点群 G = {g_j}</text>
  <text x="100" y="402" class="small">radius r_s 内で最大 k_s 点</text>
  <rect x="470" y="630" width="204" height="82" rx="8" fill="#f3f8fd" stroke="#2f6fb0" stroke-width="1.8"/>
  <text x="488" y="659" class="body">Ball Query</text>
  <text x="488" y="684" class="small">query = x_i / source = G</text>
  <text x="488" y="705" class="small">点ごと・Aggregateなし</text>

  <!-- Per-scale processing -->
  <text x="756" y="303" class="section">2. スケール別MLPで符号化し結合</text>
  <rect class="green" x="756" y="336" width="292" height="104"/>
  <circle cx="793" cy="388" r="24" fill="none" stroke="#159974" stroke-width="3"/>
  <text x="835" y="375" class="label">近距離スケール</text>
  <text x="835" y="404" class="body">BQ(r_1,k_1) → MLP_1</text>
  <text x="835" y="428" class="small">境界層・局所曲率</text>
  <rect class="geo" x="756" y="462" width="292" height="104"/>
  <circle cx="793" cy="514" r="30" fill="none" stroke="#e87924" stroke-width="3"/>
  <text x="835" y="501" class="label">中距離スケール</text>
  <text x="835" y="530" class="body">BQ(r_2,k_2) → MLP_2</text>
  <text x="835" y="554" class="small">周辺形状・相互作用</text>
  <rect class="box" x="756" y="588" width="292" height="104"/>
  <circle cx="793" cy="640" r="37" fill="none" stroke="#2f6fb0" stroke-width="3"/>
  <text x="835" y="627" class="label">遠距離スケール</text>
  <text x="835" y="656" class="body">BQ(r_3,k_3) → MLP_3</text>
  <text x="835" y="680" class="small">遠方場・非局所結合</text>
  <path class="arrow" d="M706 535 C730 535, 728 388, 748 388"/>
  <path class="arrow" d="M706 535 L748 514"/>
  <path class="arrow" d="M706 535 C730 535, 728 640, 748 640"/>

  <rect class="geo" x="1110" y="415" width="202" height="170"/>
  <text x="1137" y="450" class="label">局所特徴 u_i</text>
  <rect x="1140" y="473" width="142" height="30" rx="6" fill="#dff6ec"/><text x="1168" y="494" class="small">h_loc,1(i)</text>
  <rect x="1140" y="513" width="142" height="30" rx="6" fill="#ffead7"/><text x="1168" y="534" class="small">h_loc,2(i)</text>
  <rect x="1140" y="553" width="142" height="30" rx="6" fill="#e5f0fa"/><text x="1168" y="574" class="small">h_loc,3(i)</text>
  <path class="arrow" d="M1048 388 C1080 388, 1075 462, 1102 462"/>
  <path class="arrow" d="M1048 514 L1102 514"/>
  <path class="arrow" d="M1048 640 C1080 640, 1075 565, 1102 565"/>

  <rect class="geo" x="1360" y="415" width="184" height="170"/>
  <text x="1380" y="447" class="label">GALEへ入る</text>
  <text x="1380" y="470" class="label">点群特徴</text>
  <text x="1380" y="500" class="body">x̃_i = [x_i, u_i]</text>
  <line x1="1380" y1="510" x2="1524" y2="510" stroke="#f0a36a"/>
  <text x="1380" y="540" class="small">MLP埋め込み後の特徴へ</text>
  <text x="1380" y="565" class="small">点ごとの形状情報を追加</text>
  <path class="arrow" d="M1312 500 L1352 500"/>

  <!-- Key implications -->
  <rect x="56" y="780" width="1488" height="142" rx="8" fill="#102a43"/>
  <text x="88" y="818" class="section" style="fill:#ffffff">この変更が効く理由</text>
  <line x1="383" y1="805" x2="383" y2="897" stroke="#486581" stroke-width="2"/>
  <line x1="780" y1="805" x2="780" y2="897" stroke="#486581" stroke-width="2"/>
  <line x1="1177" y1="805" x2="1177" y2="897" stroke="#486581" stroke-width="2"/>
  <text x="88" y="856" class="label" style="fill:#ffffff">点ごとの形状記憶</text>
  <text x="88" y="886" class="small" style="fill:#d9e2ec">各 x_i に固有の u_i を保持</text>
  <text x="416" y="856" class="label" style="fill:#ffffff">マルチスケール</text>
  <text x="416" y="886" class="small" style="fill:#d9e2ec">境界近傍から遠方まで同時に表現</text>
  <text x="813" y="856" class="label" style="fill:#ffffff">初回だけ計算</text>
  <text x="813" y="886" class="small" style="fill:#d9e2ec">全層でball queryを繰り返さない</text>
  <text x="1210" y="856" class="label" style="fill:#ffffff">C_ctxとは別経路</text>
  <text x="1210" y="886" class="small" style="fill:#d9e2ec">u_iは点ごと、C_ctxは全層共有</text>

  <line x1="56" y1="950" x2="1544" y2="950" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="56" y="978" class="tiny">Source: GeoTransolver, Adams et al., arXiv:2512.20399 (v3), Sec. 3.3.2–3.3.3</text>
  <text x="1544" y="978" class="tiny" text-anchor="end">Difference 01 · Local augmentation</text>
</svg>
